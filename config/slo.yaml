service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: |
    Dựa trên baseline thực tế của hệ thống: Latency P95 trung bình đạt ~570ms (thấp hơn nhiều so với ngưỡng 3000ms) và tỷ lệ thành công là 100%.
    Với mục tiêu SLO 99.5% fast & successful requests trong chu kỳ 28 ngày:
    - Error budget = 100% - 99.5% = 0.5%.
    - Nếu lưu lượng hệ thống đạt 10,000 requests trong cửa sổ 28 ngày, số request tối đa được phép chậm (> 3000ms) hoặc lỗi là: 10,000 * 0.5% = 50 requests.
    - Khi lỗi hoặc latency cao tiêu tốn hết 50 requests này, Error Budget cạn kiệt, hệ thống kích hoạt chính sách đóng băng triển khai tính năng mới để tập trung xử lý độ ổn định.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90

